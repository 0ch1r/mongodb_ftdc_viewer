services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    command:
      - "--retentionPeriod=${VICTORIA_RETENTION_DAYS:-30}"
      - "--httpListenAddr=:8428"
      - "--storageDataPath=/victoria-metrics-data"
    volumes:
      # VictoriaMetrics uses /victoria-metrics-data by default; mount there for persistence
      - ${VICTORIA_DATA_DIRECTORY:-/tmp/victoria_data}:/victoria-metrics-data
    healthcheck:
      # Use 127.0.0.1 instead of localhost to avoid IPv6 ::1 connection issues inside the container
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # Some runtimes inject proxy vars; disable them so Grafana can always reach
      # internal Docker services directly.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=${NO_PROXY:-},victoriametrics,grafana,localhost,127.0.0.1
      - no_proxy=${no_proxy:-},victoriametrics,grafana,localhost,127.0.0.1
    links:
      - victoriametrics
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/main.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/
  ftdc_exporter:
    build: ./ftdc_exporter
    volumes:
      - ${INPUT_DIR:-./diagnostic.data}:/diagnostic.data
      - ./metrics_to_get.txt:/app/metrics_to_get.txt
    environment:
      # Some runtimes inject proxy vars; disable them for deterministic
      # connectivity to internal Docker services.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=${NO_PROXY:-},victoriametrics,grafana,localhost,127.0.0.1
      - no_proxy=${no_proxy:-},victoriametrics,grafana,localhost,127.0.0.1
    depends_on:
      victoriametrics:
        condition: service_healthy
    command: >
      ./ftdc_exporter
       --input-dir /diagnostic.data
       --metrics-include-file /app/metrics_to_get.txt
       --storage-backend ${STORAGE_BACKEND:-victoriametrics}
       --victoria-url http://victoriametrics:8428
       --victoria-token ${VICTORIA_TOKEN:-}
       --victoria-tenant ${VICTORIA_TENANT:-}
       --victoria-username ${VICTORIA_USERNAME:-}
       --victoria-password ${VICTORIA_PASSWORD:-}
       --influx-bucket ${INFLUX_BUCKET:-bucket}
       --parallel ${PARALLEL:-10}
       --batch-size ${BATCH_SIZE:-200}
